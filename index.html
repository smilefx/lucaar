<!DOCTYPE html>

<html lang="de">
    <head>
        <meta charset="utf-8" />

        <title></title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Round" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="./res/css/style_new.css" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    </head>

    <body onscroll="scrollWebsite(event);" onmousemove="moveMouse(event);">
        <div class="cursor" id="cursor">
            <div class="cursor__inner" id="cursorInner"></div>
        </div>
        <div class="menu" id="menuSection"></div>
        <header>
            <div class="header__right" id="headerMenu" state="closed" onclick="changeMenu()" style="display: none">
                <div class="menu__0"></div>
                <div class="menu__1"></div>
            </div>
        </header>
        <div class="hero" id="heroSection">
            <div class="--layer-1" id="--layer-1"></div>
            <div class="--layer-2" id="--layer-2"></div>
            <div class="--layer-3" id="--layer-3"></div>
            <div class="--layer-4" id="--layer-4"></div>
            <div class="--layer-5"></div>
        </div>
        <div class="content" id="contentSection">
            <div class="--layer-0" id="layer0">
                <h1 id="websiteName">Luca R</h1>
            </div>
            <div class="section"></div>
        </div>
        <h1 id="disclaimer"></h1>
        <img id="github" src="./res/img/github.svg" alt="" srcset="" />
        <script src="./res/js/script.js" type="text/javascript"></script>
    </body>
</html>
